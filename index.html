<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سەنتەرێ زێدەکرنا باڵانسی | LEGEND PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ffcc;
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.1);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #262626;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .user-preview {
            display: none;
            align-items: center;
            background: #222;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--primary-color);
            text-align: right;
        }

        .user-preview img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-left: 15px;
            border: 2px solid var(--primary-color);
        }

        .btn {
            width: 100%;
            background: linear-gradient(90deg, #00ffcc, #00b38f);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
        }

        .alert {
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">LEGEND PANEL</div>
        
        <div class="input-group">
            <label>تێلێگرام ID یا بەکارهێنەری:</label>
            <input type="text" id="userId" placeholder="نموونە: 123456789" oninput="checkUser()">
        </div>

        <div id="userPreview" class="user-preview">
            <img id="userAvatar" src="" alt="Profile">
            <div>
                <strong id="userName" style="color: #00ffcc;">نەدیار</strong><br>
                <span style="font-size: 0.8rem; color: #aaa;">ئەکاونتا تەلەگرام یەکانگیرە ✅</span>
            </div>
        </div>

        <div class="input-group">
            <label>ژمارەیا کلیلێن بۆ زێدەکرنێ:</label>
            <input type="number" id="keyAmount" placeholder="بۆ نموونە: 10">
        </div>

        <button class="btn" onclick="addBalanceToUser()">زێدەکرنا باڵانسی</button>
        <div id="alertMsg" class="alert"></div>
    </div>

    <script>
        const botToken = "8680499622:AAHTpgQXyGKyFATDolT6tmBH4USgct1HU4A";

        async function checkUser() {
            const userId = document.getElementById('userId').value.trim();
            const preview = document.getElementById('userPreview');
            
            if (userId.length < 5) {
                preview.style.display = 'none';
                return;
            }

            try {
                let response = await fetch(`https://api.telegram.org/bot${botToken}/getChat?chat_id=${userId}`);
                let data = await response.json();

                if (data.ok) {
                    let chat = data.result;
                    document.getElementById('userName').innerText = chat.first_name + (chat.username ? ` (@${chat.username})` : '');
                    
                    let photoRes = await fetch(`https://api.telegram.org/bot${botToken}/getUserProfilePhotos?user_id=${userId}&limit=1`);
                    let photoData = await photoRes.json();
                    
                    let avatarUrl = "https://via.placeholder.com/50";
                    if (photoData.ok && photoData.result.total_count > 0) {
                        let fileId = photoData.result.photos[0][0].file_id;
                        let fileRes = await fetch(`https://api.telegram.org/bot${botToken}/getFile?file_id=${fileId}`);
                        let fileData = await fileRes.json();
                        if (fileData.ok) {
                            avatarUrl = `https://api.telegram.org/file/bot${botToken}/${fileData.result.file_path}`;
                        }
                    }
                    
                    document.getElementById('userAvatar').src = avatarUrl;
                    preview.style.display = 'flex';
                } else {
                    preview.style.display = 'none';
                }
            } catch (error) {
                preview.style.display = 'none';
            }
        }

        async function addBalanceToUser() {
            const userId = document.getElementById('userId').value.trim();
            const amount = parseInt(document.getElementById('keyAmount').value);
            const alertMsg = document.getElementById('alertMsg');

            if (!userId || isNaN(amount)) {
                alertMsg.style.display = 'block';
                alertMsg.style.color = '#ff4d4d';
                alertMsg.innerText = "⚠️ تکایە ID و ژمارەیا دروست بنڤێسە!";
                return;
            }

            alertMsg.style.display = 'block';
            alertMsg.style.color = '#00ffcc';
            alertMsg.innerText = "⏳ ل هافێن هنارتنێ... چاڤەڕێ بە.";

            try {
                // لێرە لینکا سێرڤەرێ خوە (یا Railway) دانە
                let response = await fetch('https://لێرە-لینکا-سێرڤەرا-خوە-دانە.up.railway.app/api/add_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, amount: amount })
                });
                
                let result = await response.json();
                if (result.status === "success") {
                    alertMsg.style.color = '#00ffcc';
                    alertMsg.innerText = `🎉 ب سەرکەفتن! ${amount} کلیل زێدەبوون. باڵانسا نوو: ${result.new_balance}`;
                } else {
                    alertMsg.style.color = '#ff4d4d';
                    alertMsg.innerText = "⚠️ خەلەتیەک هشک بوتە!";
                }
            } catch (error) {
                alertMsg.style.color = '#ff4d4d';
                alertMsg.innerText = "⚠️ پەیوەندی ب سێرڤەری نەکەت! لینکا سێرڤەری پشکنە.";
            }
        }
    </script>
</body>
</html>
